version: "3.9"
services:
  db:
    image: postgres:16.11
    container_name: webtag-db
    restart: unless-stopped
    env_file:
      - ./backend/.env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

    volumes:
      - webtag_postgres_data:/var/lib/postgresql/data

volumes:
  webtag_postgres_data:
